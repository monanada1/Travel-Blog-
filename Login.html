<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="Login.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="logo">ReadMe</div>
        <h2>Welcome Back</h2>
        
        <form onsubmit="handleContact(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div style="text-align: right; margin-top: 0.5rem;">
                    <a href="forgot-password.html" style="font-size: 0.85rem;">Forgot password?</a>
                </div>
            </div>
            
            <button type="submit">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Login
            </button>
        </form>
        
        <div class="divider">or continue with</div>
        
        <div class="social-login">
            <a href="#" class="social-btn google" title="Sign in with Google">
                <i class="fab fa-google"></i>
            </a>
            <a href="#" class="social-btn facebook" title="Sign in with Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social-btn twitter" title="Sign in with Twitter">
                <i class="fab fa-twitter"></i>
            </a>
        </div>
        
        <div class="links">
            <p>Don't have an account? <a href="register.html"><i class="fas fa-user-plus"></i> Register here</a></p>
            <p>Need help? <a href="contact.html"><i class="fas fa-envelope"></i> Contact us</a></p>
            <p><a href="../home.html"><i class="fas fa-arrow-left"></i> Back to home</a></p>
        </div>
    </div>

   
</body>
</html>
